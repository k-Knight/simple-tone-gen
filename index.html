<!DOCTYPE html>
<html lang="en" class="bg-zinc-950 text-zinc-100">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Tone Generator</title>
    <script src="libs/tailwind.min.js"></script>
    <script src="libs/alpine.min.js" defer></script>
    <script src="components/regular-knob.js"></script>
    <script src="components/effect-knob.js"></script>
    <script src="components/oscillator.js"></script>
    <script src="worker/worker-dsp.js"></script>
    <script src="worker/worker-scope.js"></script>
    <script src="worker/audio-worker-text.js"></script>
    <script src="audio-engine.js"></script>
    <script src="knob.js"></script>
    <script src="app.js"></script>
</head>
<body class="min-h-screen py-8 px-4 font-sans antialiased">
    <div id="app-root" class="max-w-4xl mx-auto space-y-4" x-data="app">
        
        <header class="p-6 bg-zinc-900 border border-zinc-800 rounded-2xl shadow-xl space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
                
                <div class="md:col-span-5">
                    <h1 class="text-2xl font-bold bg-gradient-to-r from-sky-400 to-cyan-400 bg-clip-text text-transparent select-none">Simple Tone Generator</h1>
                    <p class="text-sm text-zinc-400 mt-1 select-none">High performance phase-accurate multi-oscillator workspace.</p>
                </div>
                
                <div class="md:col-span-7 flex items-center gap-4 bg-zinc-950/40 p-4 border border-zinc-800/60 rounded-xl">
                    <div class="flex-1 space-y-3">
                        <div class="flex items-center justify-between gap-3 text-xs font-mono">
                            <span class="text-zinc-500 select-none font-bold">MASTER:</span>
                            <div class="flex items-center gap-2 flex-1 justify-end">
                                <input type="range" min="0" max="1" step="0.01" x-model="masterVolume" @input="updateMaster()" class="accent-cyan-500 h-1 w-full max-w-[160px] bg-zinc-800 rounded appearance-none cursor-pointer">
                                <span class="text-cyan-400 w-10 text-right font-bold" x-text="Math.round(masterVolume * 100) + '%'"></span>
                            </div>
                        </div>

                        <div class="border-t border-zinc-800/80 pt-3 flex items-center justify-between gap-3 text-xs font-mono">
                            <span class="text-zinc-500 select-none font-bold">REC FILE:</span>
                            <div class="flex items-center gap-2">
                                <input type="number" min="1" max="10" x-model.number="recordDuration" class="w-10 bg-zinc-900 border border-zinc-800 rounded text-center py-1 text-purple-400 font-bold focus:outline-none">
                                <span class="text-zinc-500 select-none mr-1">SEC</span>
                                <button 
                                    @click="triggerRecord()" 
                                    :disabled="isRecording"
                                    :class="isRecording ? 'bg-rose-950/40 text-rose-400 border-rose-900/50 cursor-not-allowed' : 'bg-purple-950 text-purple-400 border-purple-800 hover:bg-purple-900'"
                                    class="px-3 py-1.5 text-xs font-bold border rounded-lg uppercase transition-all tracking-wider cursor-pointer" 
                                    x-text="isRecording ? 'REC...' : 'Export WAV'"></button>
                            </div>
                        </div>
                    </div>

                    <div class="w-px h-12 bg-zinc-800/80 hidden sm:block"></div>

                    <button @click="addGenerator()" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-zinc-950 font-bold text-xs rounded-xl shadow transition-all cursor-pointer border border-sky-500 uppercase tracking-wide flex items-center gap-1.5 flex-shrink-0 h-10">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                        Add Oscillator
                    </button>
                </div>
            </div>

            <div class="h-32 w-full bg-zinc-950 border border-zinc-800/80 rounded-xl overflow-hidden relative shadow-inner">
                <canvas id="scopeCanvas" width="800" height="128" class="w-full h-full block"></canvas>
                <div class="absolute top-2 right-3 text-[9px] font-mono tracking-widest text-zinc-600 select-none uppercase">COMBINED SIGNAL SCOPE</div>
            </div>
        </header>

        <main class="space-y-4">
            <template x-for="(gen, index) in generators" :key="gen.id">
                <div x-html="renderOscillator()"></div>
            </template>
            <template x-if="generators.length === 0">
                <div class="text-center py-12 border border-dashed border-zinc-800 rounded-xl text-zinc-500 text-xs select-none">No active oscillators. Click "Add Oscillator" to start synthesis.</div>
            </template>
        </main>
    </div>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('app', window.AppModule.container);
            Alpine.data('knob', (g, k, mn, mx, log, cb) => window.KnobModule.createComponent(g, k, mn, mx, log, cb));
        });
    </script>
</body>
</html>
